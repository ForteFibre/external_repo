name: Build
on:
  push:
    branches:
      - main
    paths:
      - "dependency.repos"
      - "fibril_mujoco_vendor/**"
      - "iceoryx2_vendor/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      # jazzy と lyrical を別のジョブにし、片方が落ちても他方の deb は出す
      fail-fast: false
      matrix:
        rosdistro: [jazzy, lyrical]
        platform: [arm64, amd64]
        include:
          - platform: arm64
            runs-on: ubuntu-24.04-arm
          - platform: amd64
            runs-on: ubuntu-24.04
    name: build (${{ matrix.rosdistro }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_SECRET_KEY }}

      - name: Change data-dir
        run: |
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Clone repositories
        run: |
          pip3 install vcstool
          mkdir -p external
          vcs import external < dependency.repos
          vcs pull external

      # lyrical でビルドできないパッケージを外す（colcon と rosdep は COLCON_IGNORE のあるディレクトリを見ない）
      # - behaviortree_ros2、btcpp_ros2_samples：ament_target_dependencies が lyrical で無くなった
      # - jsk_visualization：jsk_rviz_plugins が Qt5 のままで、jsk_rqt_plugins と jsk_visualization がそれに依存する
      - name: Exclude packages unsupported on lyrical
        if: matrix.rosdistro == 'lyrical'
        run: |
          touch external/behaviortree_ros2/behaviortree_ros2/COLCON_IGNORE
          touch external/behaviortree_ros2/btcpp_ros2_samples/COLCON_IGNORE
          touch external/jsk_visualization/COLCON_IGNORE

      - name: Build packages
        uses: ForteFibre/fortefibre_github_action/create_debian_packages_batch@main
        with:
          # iceoryx2_vendor は Rust 1.85 以上を要する（Ubuntu 24.04 の apt の cargo は 1.75）
          pre_script: 'apt-get update && apt-get install -y libclang-dev rustup && rustup default 1.85.0'
          s3_bucket: "fortefibre-apt"
          s3_access_key_id: ${{ secrets.S3_KEY_ID }}
          s3_access_key_secret: ${{ secrets.S3_KEY_SECRET }}
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          gpg_private_key: ${{ secrets.GPG_KEY }}
          gpg_fingerprint: 6FD24526DB354C619705230B69ACCD996E5940A7
          platform: ${{ matrix.platform }}
          # jazzy は noble、lyrical は resolute に出す
          rosdistros: ${{ matrix.rosdistro }}
